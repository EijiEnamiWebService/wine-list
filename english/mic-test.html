<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone マイク単独テスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6fb;color:#182238;max-width:620px;margin:auto;padding:20px;line-height:1.55}section{background:white;padding:16px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #10204010}button{font-size:17px;min-height:50px;padding:10px 18px;border:0;border-radius:10px;color:white;background:#2859ad;margin:5px 5px 5px 0}button:disabled{opacity:.4}button.secondary{background:#6b7280}pre{white-space:pre-wrap;word-break:break-word;background:#eef2fa;padding:12px;border-radius:8px;font-size:13px;max-height:310px;overflow:auto}.status{font-weight:700;color:#174c88}small{color:#506077}#transcript{min-height:44px}</style></head><body><h2>iPhone マイク単独テスト</h2><p>読み上げ音声を一切使わず、Safariの音声認識だけを2回連続で確認します。</p><section><p><strong>手順：</strong>「1回目を開始」→「Good morning」と話す→「停止」→「2回目を開始」→「How are you」と話す。</p><p><small>毎回、音声認識オブジェクトを新しく作成します。マイクの許可が求められたら許可してください。</small></p><button id="start">1回目を開始</button><button class="secondary" id="stop" disabled>停止</button><p>現在：<span class="status" id="status">待機中</span></p><p>認識結果：</p><div id="transcript">（まだありません）</div></section><section><b>イベント記録</b><pre id="log"></pre><button class="secondary" id="copy">結果をコピー</button><button class="secondary" id="reset">最初から</button></section><script>
(()=>{'use strict';const SR=window.SpeechRecognition||window.webkitSpeechRecognition,st=document.getElementById('start'),sp=document.getElementById('stop'),status=document.getElementById('status'),result=document.getElementById('transcript'),log=document.getElementById('log');let active=null,round=0,ending=false;function record(t){let s=new Date().toLocaleTimeString('ja-JP')+' '+t;log.textContent+=s+'\n';log.scrollTop=log.scrollHeight}function state(s){status.textContent=s;record(s)}record('対応: '+(SR?'SpeechRecognitionあり':'非対応')+' / '+navigator.userAgent);if(!SR){st.disabled=true;state('このブラウザでは音声認識非対応');return}function finish(r){if(active!==r)return;active=null;sp.disabled=true;st.disabled=false;st.textContent=round===1?'2回目を開始':`${round+1}回目を開始`;state('認識終了（次の開始を押してください）')}st.onclick=()=>{if(active)return;round++;ending=false;const r=new SR();active=r;r.lang='en-US';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;st.disabled=true;sp.disabled=false;result.textContent='（結果待ち）';state(round+'回目: start()呼び出し');r.onstart=()=>state(round+'回目: onstart');r.onaudiostart=()=>record('onaudiostart');r.onsoundstart=()=>record('onsoundstart');r.onspeechstart=()=>record('onspeechstart');r.onspeechend=()=>record('onspeechend');r.onsoundend=()=>record('onsoundend');r.onaudioend=()=>record('onaudioend');r.onresult=e=>{const chunks=Array.from(e.results).map(x=>x[0]?.transcript||'');result.textContent=chunks.join(' ');record('onresult: '+result.textContent)};r.onerror=e=>record('onerror: '+e.error+(e.message?' / '+e.message:''));r.onnomatch=()=>record('onnomatch');r.onend=()=>finish(r);try{r.start()}catch(e){record('start例外: '+e.name+' '+e.message);finish(r)}};sp.onclick=()=>{if(!active)return;state('停止要求');try{active.stop()}catch(e){record('stop例外: '+e.message)};setTimeout(()=>{if(active){record('onend未到達・強制解除');const r=active;try{r.abort()}catch(e){}finish(r)}},2000)};document.getElementById('copy').onclick=async()=>{let t='認識結果: '+result.textContent+'\n'+log.textContent;try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){prompt('結果をコピー',t)}};document.getElementById('reset').onclick=()=>location.reload();})();
</script></body></html>
