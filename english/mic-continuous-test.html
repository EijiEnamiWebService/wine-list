<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone マイク連続認識テスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f7fb;color:#16243c;margin:0;padding:20px}main{max-width:650px;margin:auto}h1{font-size:23px}p{line-height:1.6}.card{background:white;border:1px solid #dbe3ed;border-radius:16px;padding:18px;margin:16px 0}button{border:0;border-radius:10px;padding:14px 17px;font-weight:700;font-size:16px;cursor:pointer;background:#1857d7;color:white;margin:4px 4px 4px 0}button:disabled{opacity:.45}button.secondary{background:#e8edf7;color:#18335c}label{display:flex;align-items:center;gap:10px;margin:12px 0}input{width:20px;height:20px}.status{font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:330px;overflow:auto;background:#0d1b30;color:#e0e8fa;border-radius:9px;padding:12px;line-height:1.5;font-size:12px}.result{white-space:pre-wrap;min-height:70px;line-height:1.7}.hint{font-size:14px;color:#52627c}</style></head><body><main><h1>iPhone マイク連続認識テスト</h1><p>英語読み上げを使わず、<strong>同じ音声認識セッションを維持したまま</strong>、2つの英文を続けて認識できるか調べます。</p><section class="card"><strong>手順</strong><p>①「連続認識を開始」を1回押す → ②「Good morning.」と話す → ③約2秒ほど待つ → ④「How are you today?」と話す → ⑤終了後「認識を終了」を押す。</p><p class="hint">発話の間に「開始」を押し直さないでください。途中でSafariが認識を終了した場合は、そのことを記録します。Safariが continuous モードを無視することもあります。</p><label><input type="checkbox" id="auto" /> Safariが勝手に終了したら自動再開を試す（追加診断用・初期OFF）</label><button id="start">連続認識を開始</button><button class="secondary" id="stop" disabled>認識を終了</button><button class="secondary" id="copy">ログをコピー</button><p class="status" id="status">状態：未開始</p></section><section class="card"><strong>認識した英文</strong><div class="result" id="result">（結果待ち）</div><p class="hint" id="partial"></p></section><section class="card"><strong>イベントログ</strong><pre id="log"></pre></section></main><script>
(()=>{'use strict';const API=window.SpeechRecognition||window.webkitSpeechRecognition;const $=id=>document.getElementById(id);let recognition=null,run=false,generation=0,attempt=0,stopping=false,restartTimer=null;let phrases=[];const maxAutoRestart=2;
function stamp(){return new Date().toLocaleTimeString('ja-JP',{hour12:false})}function log(s){$('log').textContent+=`${stamp()} ${s}\n`;$('log').scrollTop=$('log').scrollHeight}function state(s){$('status').textContent='状態：'+s;log(s)}function buttons(){ $('start').disabled=run;$('stop').disabled=!run}function finish(reason){run=false;stopping=true;clearTimeout(restartTimer);buttons();state(reason)}
function begin(){if(!API){state('このブラウザはSpeechRecognitionに対応していません');return}if(run)return;run=true;stopping=false;generation++;attempt=0;phrases=[];$('result').textContent='（結果待ち）';$('partial').textContent='';$('log').textContent='';buttons();log('対応: '+(window.SpeechRecognition?'SpeechRecognition':'webkitSpeechRecognition')+' / '+navigator.userAgent);startSession(generation)}
function startSession(gen){if(!run||stopping||gen!==generation)return;attempt++;const rec=new API();recognition=rec;rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;let lastFinalIndex=0;log(`セッション${attempt}: start() 準備 / continuous=${rec.continuous}, interimResults=${rec.interimResults}`);
rec.onstart=()=>log(`セッション${attempt}: onstart`);rec.onaudiostart=()=>log('onaudiostart');rec.onsoundstart=()=>log('onsoundstart');rec.onspeechstart=()=>log('onspeechstart');rec.onspeechend=()=>log('onspeechend');rec.onsoundend=()=>log('onsoundend');rec.onaudioend=()=>log('onaudioend');
rec.onresult=(e)=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const item=e.results[i],t=item[0]?.transcript||'';if(item.isFinal){if(i>=lastFinalIndex){phrases.push(t.trim());lastFinalIndex=i+1;log('確定: '+t.trim())}}else interim+=t}if(phrases.length)$('result').textContent=phrases.map((p,i)=>`${i+1}. ${p}`).join('\n');$('partial').textContent=interim?'認識途中: '+interim:'';if(interim)log('途中: '+interim)};
rec.onerror=(e)=>{log(`onerror: ${e.error||'unknown'}${e.message?' / '+e.message:''}`);if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){finish('権限・マイクエラー: '+e.error)}};
rec.onend=()=>{log(`セッション${attempt}: onend`);if(recognition===rec)recognition=null;if(!run||stopping||gen!==generation)return;if($('auto').checked&&attempt<=maxAutoRestart){state(`Safariが終了しました。${attempt}回目の再開を試行します`);restartTimer=setTimeout(()=>startSession(gen),900)}else{finish('Safari側で認識終了（2回の発話を拾えたかログを確認してください）')}};
try{rec.start();state('認識中：2つの英文を続けて発話してください')}catch(e){log('start()例外: '+e.name+' '+e.message);finish('認識開始エラー')}}
function stop(){if(!run)return;stopping=true;run=false;generation++;clearTimeout(restartTimer);const r=recognition;recognition=null;buttons();if(r){try{r.stop()}catch(e){log('stop()例外: '+e.message)}}state('ユーザー操作で認識を終了しました')}
$('start').addEventListener('click',begin);$('stop').addEventListener('click',stop);$('copy').addEventListener('click',async()=>{const t=`${$('status').textContent}\n認識結果:\n${$('result').textContent}\nイベントログ:\n${$('log').textContent}`;try{await navigator.clipboard.writeText(t);state('ログをコピーしました')}catch(e){const f=document.createElement('textarea');f.value=t;document.body.appendChild(f);f.select();document.execCommand('copy');f.remove();state('ログをコピーしました（代替方法）')}});log('ページ読み込み完了');})();
</script></body></html>
